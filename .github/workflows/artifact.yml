name: Paper artifact verification
permissions:
  contents: read
on:
  push:
    paths: ['artifact/**', '.github/workflows/artifact.yml']
  pull_request:
    paths: ['artifact/**', '.github/workflows/artifact.yml']
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: artifact/requirements-metrics.txt
      - run: python -m pip install -r artifact/requirements-metrics.txt
      - run: python artifact/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-metric-verification
          path: results/artifact_verification.json
